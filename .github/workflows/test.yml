name: Test

# Full test suites across the workspace, in one job. Found the hard way
# (2026-07-30) that contracts/midnight's compiled output isn't just a
# packages/zk-proofs dependency — integration/midnight-client.ts and several
# integration/tests/*.ts files import it directly too — so a split that put
# integration in its own job (without the Compact CLI/compile step) kept
# failing. Rather than keep discovering one more hidden dependent, every
# package that needs it now lives in this one job, compiled once.
#
# Uses `npm install`, not `npm ci` — see checks.yml's own comment for why
# (fast-moving Midnight SDK platform-optional dependencies keep drifting
# `npm ci`'s strict lockfile-sync check even from a freshly-regenerated,
# real-Linux lockfile).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test — contracts/midnight, integration, packages/zk-proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
      # Read the compiler pin from contracts/midnight/compact-toolchain.txt
      # rather than taking whatever is newest, so the LANGUAGE version CI
      # compiles against cannot drift away from the one the contracts' own
      # pragma declares. Same discipline as the Cardano workflow, which reads
      # its Aiken pin out of aiken.toml.
      - name: Install the pinned Compact compiler
        run: |
          export PATH="$HOME/.compact/bin:$PATH"
          version="$(grep -vE '^[[:space:]]*(#|$)' contracts/midnight/compact-toolchain.txt | tail -1 | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "Could not read the compiler pin from contracts/midnight/compact-toolchain.txt" >&2
            exit 1
          fi
          echo "Using Compact toolchain $version (from compact-toolchain.txt)"
          compact update "$version"

      # A pin nothing checks is a comment. `compact update` resolves a partial
      # version, so confirm what actually landed is what was asked for.
      - name: Confirm the installed compiler matches the pin
        run: |
          export PATH="$HOME/.compact/bin:$PATH"
          want="$(grep -vE '^[[:space:]]*(#|$)' contracts/midnight/compact-toolchain.txt | tail -1 | tr -d '[:space:]')"
          got="$(compact compile --version | tr -d '[:space:]')"
          echo "pinned: $want / installed: $got"
          if [ "$want" != "$got" ]; then
            echo "Compact compiler is $got but this project pins $want." >&2
            exit 1
          fi
      - name: Install workspace dependencies
        run: npm install
      - name: Run contracts/midnight tests (globalSetup compiles all 8 PSMs first, via scripts/run-compile.mjs)
        run: |
          export PATH="$HOME/.compact/bin:$PATH"
          npm run test --workspace=@noctis/midnight-contracts
      # With coverage, because integration/vitest.config.ts declares thresholds
      # and they are only a floor if something checks them. Run without
      # --coverage, vitest reports the tests and says nothing about the
      # thresholds at all — which is how coverage was measured here for months
      # and could only ever drift downward.
      - name: Run integration tests, with the coverage floor enforced
        run: npm run test:coverage --workspace=@noctis/integration
      - name: Build integration CLI bundles (esbuild) — catches real bundling breakage tests alone don't
        working-directory: integration
        run: node build.mjs
      - name: Run packages/zk-proofs tests (imports contracts/midnight's now-compiled output)
        run: npm run test --workspace=@noctis/zk-proofs
