name: Cardano contracts

# Aiken validators: formatting gate, tests, build, and a blueprint-freshness guard.
#
# WHY THIS EXISTS
# ---------------
# Until this workflow, neither checks.yml nor test.yml touched Aiken at all —
# the Cardano validators were never compiled or tested in CI, only locally.
# This closes that, and adds one guard the TypeScript side depends on.
#
# THE FRESHNESS GUARD, AND THE GAP IT CLOSES
# ------------------------------------------
# `integration/tests/schema-drift-guard.test.ts` asserts our hand-mirrored Lucid
# datum schemas match `contracts/cardano/plutus.json`. That guard is only as
# good as plutus.json being CURRENT: if someone edits a .ak file and forgets to
# regenerate the blueprint, the mirror and the blueprint stay consistent with
# each other while both drift away from the actual on-chain bytecode — and every
# test still passes. This job rebuilds the blueprint and fails if the committed
# copy differs, which makes the chain complete:
#
#   .ak source  --(this job)-->  plutus.json is current
#   plutus.json --(drift guard in test.yml)-->  TypeScript mirrors are correct
#
# A stale plutus.json has already caused a real bug in this project (a security
# fix and a whole validator were missing from it for days), so this is a
# regression guard, not a hypothetical.
#
# WHY IT RUNS ON EVERY BRANCH, NOT JUST main
# ------------------------------------------
# It used to run only on main, which is not where validators are edited. A
# guard that fires only after a branch merges cannot protect the weeks of
# validator work that happen before that, and it did not: a feature branch
# carrying substantial validator changes recorded ZERO runs of this workflow
# over its whole life, because no push to it ever matched the trigger. The
# freshness guard was correct the entire time and simply never executed.
#
# A blueprint is also where the cost of being wrong is highest and latest: a
# hash is an address, and a hash that drifts from its source is only noticed
# once something is deployed to the wrong one. That is precisely the failure
# this job is cheap enough to catch on every push.
#
# WHY IT COVERS BOTH PACKAGES
# ---------------------------
# There are two Aiken packages, and only the launch validators were ever built
# here. `contracts/cardano-dex` — the trading venue, the newest code and the
# only package whose validators are parameterised before deployment — had never
# been compiled or tested by CI on any branch. Its blueprint is the source of
# the unapplied hashes that `dex-applied-scripts.test.ts` checks the deployment
# record against, so a stale one there would let that test verify a deployment
# against the wrong bytes. Both packages are built the same way and pin the
# same compiler, so the matrix costs one line and closes that asymmetry.
#
# Verified locally before each package was added: a fresh `aiken build`
# reproduces the committed blueprint byte for byte in both, on the compiler the
# respective aiken.toml pins. Neither leg was added speculatively.
#
# Warnings are NOT treated as failures: `--deny-warnings` is deliberately not
# used, so this job does not fail on pre-existing lint debt it was not written
# to fix.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  aiken:
    name: Aiken — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      # Both legs always report. A failure in one package says nothing about
      # the other, and cancelling the sibling would hide that.
      fail-fast: false
      matrix:
        package: [cardano, cardano-dex]
    defaults:
      run:
        working-directory: contracts/${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      # Read the compiler pin from the package's own aiken.toml rather than
      # hardcoding it here, so the toolchain used by CI can never silently
      # drift from the version that package actually declares — and so the two
      # packages are free to pin different compilers without this file caring.
      - name: Resolve the pinned Aiken version from aiken.toml
        id: aiken-version
        run: |
          version="$(grep -E '^compiler[[:space:]]*=' aiken.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$version" ]; then
            echo "Could not read the compiler pin from contracts/${{ matrix.package }}/aiken.toml" >&2
            exit 1
          fi
          echo "Using Aiken $version (from contracts/${{ matrix.package }}/aiken.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: aiken-lang/setup-aiken@v1
        with:
          version: ${{ steps.aiken-version.outputs.version }}

      - name: Confirm the installed toolchain matches the pin
        run: aiken --version

      # The formatter is a gate, not a suggestion. Both packages are formatted
      # with the pinned toolchain's own `aiken fmt`, and a tree that drifts
      # from it fails here, so layout differences never accumulate silently
      # again and every validator diff reads as a change of meaning.
      - name: aiken fmt --check
        run: aiken fmt --check

      # The real validator test suite for this package.
      - name: aiken check
        run: aiken check

      - name: aiken build (regenerates plutus.json)
        run: aiken build

      # The guard itself. If a .ak file changed without the blueprint being
      # regenerated and committed, the rebuild above will have rewritten
      # plutus.json and this fails with the exact diff.
      - name: plutus.json must be current
        run: |
          if ! git diff --exit-code -- plutus.json; then
            echo ""
            echo "::error file=contracts/${{ matrix.package }}/plutus.json::plutus.json is out of date with the .ak sources."
            echo "A validator changed but the compiled blueprint was not regenerated."
            echo "Fix: run 'aiken build' in contracts/${{ matrix.package }} and commit the updated plutus.json."
            echo "This matters because a hash is an address: every script address, every"
            echo "reference script and every applied-parameter chain derives from these bytes,"
            echo "and a blueprint that has drifted from its source sends work to an address"
            echo "that is real, reachable and wrong."
            exit 1
          fi
          echo "plutus.json matches a fresh build of the current .ak sources."

      # Surfaces the compiled artifact for inspection when a run does fail.
      - name: Upload the freshly built blueprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plutus-json-${{ matrix.package }}
          path: contracts/${{ matrix.package }}/plutus.json
          if-no-files-found: warn
